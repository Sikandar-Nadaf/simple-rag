[project]
name = "first-rag"
version = "0.1.0"
description = "A local-first RAG application built with FastAPI, Chroma, and Ollama."
requires-python = ">=3.10"
dependencies = [
    "chromadb>=0.5.0,<0.7.0",
    "fastapi>=0.115.0,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
    "jinja2>=3.1.0,<4.0.0",
    "python-multipart>=0.0.9,<1.0.0",
    "uvicorn>=0.30.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["rag_app", "rag_app.providers"]

[tool.setuptools.package-data]
rag_app = ["templates/*.html"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
